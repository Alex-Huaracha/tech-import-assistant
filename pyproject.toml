[project]
name = "tech-import-assistant"
version = "0.1.0"
description = "Assistant for importing technology products into Peru, built on RAG over customs regulations"
readme = "README.md"
authors = [
    { name = "Alex Huaracha", email = "129701149+Alex-Huaracha@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
tech-import-assistant = "tech_import_assistant.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
