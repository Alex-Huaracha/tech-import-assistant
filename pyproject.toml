[project]
name = "support-assistant"
version = "0.1.0"
description = "Customer support assistant for an e-commerce store, built on RAG"
readme = "README.md"
authors = [
    { name = "Alex Huaracha", email = "129701149+Alex-Huaracha@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
support-assistant = "support_assistant.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
