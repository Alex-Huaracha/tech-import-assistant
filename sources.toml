# Catalog of source documents for the knowledge base.
#
# Each [[source]] is one official document. download.py fetches `url` into
# data/raw/<id>.<format>; ingest.py later reads it with `encoding` and keeps
# only the articles in `keep_articles` (the scope: what applies to someone
# importing technology products to sell). Ranges are inclusive; "210-" means
# "from 210 to the end". No `keep_articles` means the whole document applies.

[[source]]
id = "lga"
title = "Ley General de Aduanas (Decreto Legislativo 1053), texto consolidado"
issuer = "SUNAT"
url = "https://www.sunat.gob.pe/legislacion/procedim/normasadua/gja-03normasoc.htm"
format = "html"
encoding = "windows-1252"  # the server's HTTP header says utf-8; the page's <meta> is right
keep_articles = [
    "1-3",      # objeto, definiciones, ámbito
    "49-50",    # importación para el consumo
    "98",       # regímenes de excepción: courier, envíos postales
    "129-179",  # declaración, régimen tributario, control, levante, prenda y abandono legal
    "188-204",  # infracciones y sanciones
    "205-",     # procedimientos aduaneros y resoluciones anticipadas
]

