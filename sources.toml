    "10",       # consultas a la administración aduanera
    "65-66",    # importación para el consumo
    "184-234",  # declaración (incl. simplificada y restringidas), tributos, garantías, control, levante
    "236-237",  # abandono voluntario y recuperación de mercancías en abandono legal
    "242-243",  # disposición de mercancías restringidas
    "246-252",  # infracciones y sanciones
    "255-",     # resoluciones anticipadas
]

[[source]]
id = "despa-pg01"
title = "Procedimiento General Importación para el Consumo (DESPA-PG.01)"
issuer = "SUNAT"
url = "https://www.sunat.gob.pe/legislacion/procedim/despacho/importacion/importac/procGeneral/despa-pg.01.htm"
format = "html"
structure = "procedure"
encoding = "windows-1252"
skip_sections = [
    "I", "II", "III",  # objetivo, alcance, responsabilidad: administrative boilerplate
    "V",               # base legal: only a list of norm names, no rules
    "VI.G",            # local temporalmente considerado zona primaria: large importers only
    "VI.J",            # mercancías vigentes: containers and heavy machinery in several shipments
    "VI.M",            # otras disposiciones: internal office hours
    "VII.A.5",         # asignación de funcionarios: internal to SUNAT
    "VII.A.10",        # continuación del despacho: internal to SUNAT
    "VII.D",           # casos especiales: bulk cargo, pipelines, electric power
    "VIII", "IX",      # vigencia, anexos
]
